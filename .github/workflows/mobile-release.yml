name: mobile-release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile-app/**"
      - ".github/workflows/mobile-release.yml"
      - ".github/workflows/mobile-checks.yml"

defaults:
  run:
    working-directory: mobile-app

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/mobile-checks.yml

  build-release:
    name: build-release
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve version
        id: version
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "tag=v${BASE}+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build release APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.version.outputs.base }} \
            --build-number=${{ github.run_number }}
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app-${abi}-release.apk" "TextGenie-${abi}.apk"
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            mobile-app/build/app/outputs/flutter-apk/TextGenie-arm64-v8a.apk
            mobile-app/build/app/outputs/flutter-apk/TextGenie-armeabi-v7a.apk
            mobile-app/build/app/outputs/flutter-apk/TextGenie-x86_64.apk

      - name: Prune old releases (keep newest 5)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
          | while read -r tag; do
              [ -z "$tag" ] && continue
              echo "Deleting old release $tag"
              gh release delete "$tag" --cleanup-tag --yes
            done
